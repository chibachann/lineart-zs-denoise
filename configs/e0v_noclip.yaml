# E0 の検証1: ガウスノイズを [0,1] に切り詰めない場合に、論文との差（−0.1〜−0.3 dB）が縮まるか（Kodak24 のみ）
name: e0v_noclip
datasets:
  - {name: kodak24, dir: data/kodak24}
crop: 256              # 中央 256×256 を切り出す（論文と同じ）
noises:
  - {kind: gauss, level: 10, clip: false}
  - {kind: gauss, level: 25, clip: false}
  - {kind: gauss, level: 50, clip: false}
noise_seeds: [0]       # ノイズの乱数。保存して全手法で共有する
init_seeds: [0]        # ネットの初期値の乱数
method:
  name: zsn2n
  chan_embed: 48
  iters: 2000
  lr: 0.001
  step_size: 1500
  gamma: 0.5
device: auto           # mps（Mac の GPU）/ cpu / cuda / auto
workers: 4             # CPU のときの並列プロセス数
threads_per_worker: 2
out_dir: results
noise_cache: data/noisy
