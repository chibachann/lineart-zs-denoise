# E1: 合成線画ベンチマーク（古典手法）。太さ 5 × 向き 8 × 墨の濃さ 2 = 80 枚、ガウスノイズ σ=10/25/50
# ノイズは [0,1] に切り詰めない（白=1・黒=0 の画像では切り詰めるとノイズの平均がずれ、仮説 H1 と別の要因が混ざるため）
name: e1_classic
bench:
  widths: [1, 1.5, 2, 3, 4]
  n_angles: 8            # 0°〜157.5°、22.5° 刻み
  contrasts: [1.0, 0.5]  # 1.0 = 黒いペン、0.5 = 鉛筆のような灰色
  size: 256
  jitter: true           # 線の間隔を 12〜24px でランダムに（等間隔は BM3D に有利すぎる）
noises:
  - {kind: gauss, level: 10, clip: false}
  - {kind: gauss, level: 25, clip: false}
  - {kind: gauss, level: 50, clip: false}
noise_seeds: [0]
init_seeds: [0]
methods:
  - {name: identity}     # 何もしない（ノイズ画像そのもの）
  - {name: median3}
  - {name: nlm}          # σ を知っている前提
  - {name: bm3d}         # σ を知っている前提
device: cpu
threads: 4
out_dir: results
noise_cache: data/noisy
