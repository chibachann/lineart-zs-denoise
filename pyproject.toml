[project]
name = "zsdn"
version = "0.1.0"
description = "線画のゼロショット・ノイズ除去の研究用コード（テーマ A）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scikit-image>=0.24",
    "bm3d>=4.0.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Linux（Docker・Kubernetes）では CPU 版の PyTorch を使う。
# 既定の PyPI 版は GPU 用ライブラリまで入り、イメージが約 19GB になるため。Mac は PyPI 版（MPS 対応）のまま。
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/zsdn"]
